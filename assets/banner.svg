<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0b0e1a"/>
<stop offset="0.55" stop-color="#141225"/>
<stop offset="1" stop-color="#1c1030"/>
</linearGradient>
<radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
<stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
<stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2b2f45"/>
<stop offset="1" stop-color="#161826"/>
</linearGradient>
<linearGradient id="sliderTrack" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/>
<stop offset="1" stop-color="#7c3aed"/>
</linearGradient>
<linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#c9c3ff"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
<circle cx="980" cy="80" r="260" fill="url(#glow1)"/>
<circle cx="850" cy="280" r="220" fill="url(#glow2)"/>

<!-- subtle grid -->
<g stroke="#2a2d40" stroke-width="1" opacity="0.3">
<line x1="0" y1="60" x2="1200" y2="60"/>
<line x1="0" y1="120" x2="1200" y2="120"/>
<line x1="0" y1="180" x2="1200" y2="180"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="300" x2="1200" y2="300"/>
</g>

<!-- big gear cluster right side -->
<g transform="translate(940,120)" opacity="0.9">
<g fill="url(#gear)" stroke="#3a3f5c" stroke-width="2">
<circle cx="0" cy="0" r="70"/>
<rect x="-8" y="-90" width="16" height="24"/>
<rect x="-8" y="66" width="16" height="24"/>
<rect x="-90" y="-8" width="24" height="16"/>
<rect x="66" y="-8" width="24" height="16"/>
<rect x="-58" y="-70" width="16" height="24" transform="rotate(45 0 0)"/>
<rect x="-58" y="46" width="16" height="24" transform="rotate(-45 0 0)"/>
<rect x="46" y="-70" width="16" height="24" transform="rotate(-45 0 0)"/>
<rect x="46" y="46" width="16" height="24" transform="rotate(45 0 0)"/>
</g>
<circle cx="0" cy="0" r="34" fill="#0f1120" stroke="#7c3aed" stroke-width="2"/>
<circle cx="0" cy="0" r="10" fill="#22d3ee"/>
</g>

<g transform="translate(1070,220)" opacity="0.85">
<g fill="url(#gear)" stroke="#3a3f5c" stroke-width="2">
<circle cx="0" cy="0" r="46"/>
<rect x="-6" y="-60" width="12" height="18"/>
<rect x="-6" y="42" width="12" height="18"/>
<rect x="-60" y="-6" width="18" height="12"/>
<rect x="42" y="-6" width="18" height="12"/>
<rect x="-40" y="-48" width="12" height="18" transform="rotate(45 0 0)"/>
<rect x="-40" y="30" width="12" height="18" transform="rotate(-45 0 0)"/>
<rect x="28" y="-48" width="12" height="18" transform="rotate(-45 0 0)"/>
<rect x="28" y="30" width="12" height="18" transform="rotate(45 0 0)"/>
</g>
<circle cx="0" cy="0" r="22" fill="#0f1120" stroke="#22d3ee" stroke-width="2"/>
</g>

<!-- toggle sliders decorative -->
<g transform="translate(760,60)">
<rect x="0" y="0" width="150" height="14" rx="7" fill="#2a2d40"/>
<rect x="0" y="0" width="95" height="14" rx="7" fill="url(#sliderTrack)"/>
<circle cx="95" cy="7" r="11" fill="#ffffff"/>
</g>
<g transform="translate(760,95)">
<rect x="0" y="0" width="150" height="14" rx="7" fill="#2a2d40"/>
<rect x="0" y="0" width="55" height="14" rx="7" fill="url(#sliderTrack)"/>
<circle cx="55" cy="7" r="11" fill="#ffffff"/>
</g>
<g transform="translate(760,130)">
<rect x="0" y="0" width="150" height="14" rx="7" fill="#2a2d40"/>
<rect x="0" y="0" width="120" height="14" rx="7" fill="url(#sliderTrack)"/>
<circle cx="120" cy="7" r="11" fill="#ffffff"/>
</g>

<!-- launcher window frame motif bottom right -->
<g transform="translate(860,270)" opacity="0.5">
<rect x="0" y="0" width="220" height="70" rx="10" fill="#12142a" stroke="#3a3f5c" stroke-width="2"/>
<circle cx="18" cy="16" r="4" fill="#ef4444"/>
<circle cx="34" cy="16" r="4" fill="#f59e0b"/>
<circle cx="50" cy="16" r="4" fill="#22c55e"/>
<line x1="16" y1="36" x2="200" y2="36" stroke="#3a3f5c" stroke-width="3"/>
<line x1="16" y1="50" x2="150" y2="50" stroke="#3a3f5c" stroke-width="3"/>
</g>

<!-- left accent bar -->
<rect x="60" y="118" width="6" height="90" rx="3" fill="url(#sliderTrack)"/>

<text x="80" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="url(#headGrad)" textLength="900" lengthAdjust="spacingAndGlyphs">
Epic Games Launcher
<tspan x="80" dy="76" textLength="380" lengthAdjust="spacingAndGlyphs">Tweaker</tspan>
</text>

<text x="80" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#a9b4d0" textLength="820" lengthAdjust="spacingAndGlyphs">
Tweak and customize settings for the Epic Games Launcher ecosystem
</text>
</svg>